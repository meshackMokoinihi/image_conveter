<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracted Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-4">
        <h3>Extracted Images from PDF</h3>
        <div class="row">
            {% for image_path in images %}
                <div class="col-md-3">
                    <div class="card mb-4">
                        <img src="{{ url_for('workingPdf.display_image', filename=image_path.split('/')[-1]) }}" class="card-img-top" alt="Extracted Image">
                        <div class="card-body text-center">
                            <a href="{{ url_for('workingPdf.download_image', filename=image_path.split('/')[-1]) }}" class="btn btn-primary">Download</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
